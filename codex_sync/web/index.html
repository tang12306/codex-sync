<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Sync 控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">CS</div>
          <div class="brand-text">
            <span class="brand-name">Codex Sync</span>
            <span class="brand-sub" id="brand-sub">本机同步控制台</span>
          </div>
        </div>
        <nav class="nav" id="nav">
          <div class="nav-section">主要任务</div>
          <a class="nav-item" href="#/overview" data-route="overview">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首页</span>
          </a>
          <a class="nav-item" href="#/conversations" data-route="conversations">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>对话与渠道</span>
          </a>
          <a class="nav-item" href="#/project" data-route="project">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>项目同步</span>
          </a>
          <a class="nav-item" href="#/backups" data-route="backups">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
              <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
            </svg>
            <span>备份与恢复</span>
          </a>
          <div class="nav-section">管理与高级</div>
          <a class="nav-item" href="#/settings" data-route="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>系统设置</span>
          </a>
        </nav>
        <div class="sidebar-foot" id="sidebar-foot">Codex Sync · v0.2.0</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="view-title">概览</h1>
            <p id="view-sub">本机与 Codex 云端的同步状态</p>
          </div>
          <div class="topbar-actions">
            <span class="conn-pill" id="conn-pill" data-state="unknown">未连接</span>
            <button class="btn btn-ghost btn-sm" id="logs-toggle" type="button">日志</button>
            <button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">刷新</button>
            <button class="btn btn-primary btn-sm" id="sync-btn" type="button">立即同步</button>
          </div>
        </header>
        <main class="view" id="view-root"></main>
      </div>
    </div>

    <!-- 远端快照详情/还原抽屉（由 views/drawer.js 填充） -->
    <div class="drawer" id="drawer-root" aria-hidden="true"></div>
    <!-- 全局日志滑出面板（由 views/logs.js 填充） -->
    <aside class="logs-panel" id="logs-root" aria-hidden="true"></aside>
    <!-- 浮动通知 -->
    <div class="toast-root" id="toast-root"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
