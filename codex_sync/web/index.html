<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Sync</title>
    <script>
      // 在样式加载前应用用户选择的主题，避免先闪一下默认主题。
      try {
        var savedTheme = localStorage.getItem("codex-sync-theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <rect class="bm-tile" x="0.5" y="0.5" width="39" height="39" rx="10" />
            <rect class="bm-device" x="5" y="11" width="16" height="11" rx="1.5" />
            <path class="bm-device" d="M3 25.5H23" />
            <rect class="bm-device" x="27" y="13" width="8" height="14" rx="1.8" />
            <path class="bm-up" d="M15 7.5C20 3.5 27 3.5 31 9M30.9 5.5L31 9L27.7 7.9" />
            <path class="bm-down" d="M31 30.5C27 35.5 18 35.5 13 29.5M13.3 33L13 29.5L16.4 30.4" />
          </svg>
          <div class="brand-text">
            <span class="brand-name">Codex Sync</span>
            <span class="brand-sub" id="brand-sub">本机同步控制台</span>
          </div>
        </div>
        <nav class="nav" id="nav" aria-label="主导航">
          <div class="nav-section">主要任务</div>
          <a class="nav-item" href="#/overview" data-route="overview">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>首页</span>
          </a>
          <a class="nav-item" href="#/conversations" data-route="conversations">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>对话与渠道</span>
          </a>
          <a class="nav-item" href="#/project" data-route="project">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>项目备份</span>
          </a>
          <a class="nav-item" href="#/backups" data-route="backups">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
              <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
            </svg>
            <span>对话备份</span>
          </a>
          <div class="nav-section">管理</div>
          <a class="nav-item" href="#/settings" data-route="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>系统设置</span>
          </a>
        </nav>
        <div class="sidebar-foot" id="sidebar-foot">Codex Sync · v0.4.0</div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="view-title">首页</h1>
            <p id="view-sub">本机同步状态与常用任务</p>
          </div>
          <div class="topbar-actions">
            <button class="conn-pill" id="conn-pill" type="button" data-state="unknown" title="点击重新检查服务器连接">正在读取状态…</button>
            <button class="btn btn-ghost btn-sm" id="logs-toggle" type="button" aria-controls="logs-root" aria-expanded="false">日志</button>
            <button class="btn btn-ghost btn-sm" id="refresh-btn" type="button">刷新</button>
            <button class="btn btn-primary btn-sm" id="sync-btn" type="button">立即同步</button>
          </div>
        </header>
        <main class="view" id="view-root"></main>
      </div>
    </div>

    <!-- 全局日志滑出面板（由 views/logs.js 填充） -->
    <aside class="logs-panel" id="logs-root" aria-label="运行日志" aria-hidden="true"></aside>
    <!-- 浮动通知 -->
    <div class="toast-root" id="toast-root" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
